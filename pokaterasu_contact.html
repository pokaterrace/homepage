<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | ぽかてらす</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>

  :root{
    --ivory:#F7F1E4;
    --ivory-deep:#F1E9D8;
    --brown:#4A3526;
    --brown-soft:#7A5C46;
    --green:#8CA279;
    --green-soft:#DCE6D0;
    --spice:#C97B2E;
    --white:#FFFDF8;
    --pink:#E7A79C;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--brown);
    font-family:'Zen Maru Gothic', sans-serif;
    overflow-x:hidden;
  }
  .hand{ font-family:'Yomogi', cursive; }

  .leaf-bg{ position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.55; }

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(247,241,228,0.94);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px;
    border-bottom:2px dashed var(--brown-soft);
  }
  .logo-mark-img{ height:46px; width:auto; display:block; }
  .header-right{ display:flex; align-items:center; gap:10px; }
  .book-btn{
    background:var(--spice); color:#fff; font-size:12.5px;
    padding:9px 16px; border-radius:22px; text-decoration:none;
    box-shadow:0 4px 0 #9c5c1c; white-space:nowrap;
    transition:transform .15s ease;
  }
  .book-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #9c5c1c; }
  .burger{
    width:38px; height:38px; border:none; background:none; cursor:pointer;
    display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px;
  }
  .burger span{ width:22px; height:2px; background:var(--brown); border-radius:2px; transition:.25s; }
  .burger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .burger.open span:nth-child(2){ opacity:0; }
  .burger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

  nav.drawer{
    position:fixed; top:0; right:0; height:100%; width:78%; max-width:320px;
    background:var(--white); z-index:40;
    box-shadow:-8px 0 30px rgba(0,0,0,0.15);
    transform:translateX(100%); transition:transform .3s ease;
    padding:80px 26px 26px; display:flex; flex-direction:column; gap:6px;
  }
  nav.drawer.open{ transform:translateX(0); }
  nav.drawer a{
    color:var(--brown); text-decoration:none; font-size:15px; padding:12px 4px;
    border-bottom:1px dashed var(--ivory-deep);
  }
  .drawer-book{
    margin-top:14px; text-align:center; background:var(--spice); color:#fff;
    padding:12px; border-radius:22px; text-decoration:none; font-size:14px;
  }
  .scrim{
    position:fixed; inset:0; background:rgba(74,53,38,0.35); z-index:35;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }

  main{ position:relative; z-index:1; }

  /* ---------- HERO ---------- */
  .hero{ position:relative; padding:56px 22px 100px; text-align:center; overflow:hidden; }
  .hero .eyebrow{ font-size:13px; letter-spacing:.15em; color:var(--spice); margin-bottom:10px; }
  .hero h1{ font-family:'Yomogi', cursive; font-size:46px; line-height:1.35; margin:0 0 14px; }
  .hero h1 span{ color:var(--spice); }
  .hero p{ font-size:14.5px; color:var(--brown-soft); max-width:420px; margin:0 auto 26px; line-height:1.9; }
  .cta{
    display:inline-block; background:var(--brown); color:var(--white);
    padding:14px 32px; border-radius:30px; text-decoration:none; font-size:14.5px;
    box-shadow:0 6px 0 var(--brown-soft); transition:transform .15s ease;
  }
  .cta:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--brown-soft); }

  .leaf-corner{ position:absolute; opacity:.9; animation:sway 6s ease-in-out infinite; }
  @keyframes sway{ 0%,100%{ transform:rotate(0deg) translateY(0);} 50%{ transform:rotate(3deg) translateY(-4px);} }

  .polaroid{
    position:relative; background:#fff; padding:10px 10px 26px;
    box-shadow:0 10px 24px rgba(74,53,38,0.18);
    transform:rotate(-6deg); z-index:5;
    animation:bob 5s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{ transform:rotate(-6deg) translateY(0);} 50%{ transform:rotate(-4deg) translateY(-8px);} }
  .polaroid img{ display:block; width:150px; height:180px; object-fit:cover; border-radius:2px; }
  .polaroid .cap{ position:absolute; bottom:5px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:5px; }
  .polaroid .cap .hand{ font-size:13px; color:var(--brown-soft); }
  .polaroid-row{ display:flex; justify-content:center; margin-top:32px; }
  @media(max-width:420px){
    .hero h1{ font-size:34px; }
    .polaroid img{ width:120px; height:144px; }
  }

  /* ---------- reveal-on-scroll ---------- */
  .reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease; }
  .reveal.show{ opacity:1; transform:translateY(0); }

  /* ---------- shared section ---------- */
  section{ padding:50px 22px; position:relative; scroll-margin-top:76px; }
  .section-title{ font-family:'Yomogi', cursive; font-size:27px; text-align:center; margin:0 0 6px; }
  .section-sub{ text-align:center; font-size:11.5px; color:var(--brown-soft); letter-spacing:.1em; margin-bottom:30px; }

  .about{ background:var(--white); border-radius:36px; margin:0 14px; }
  .about-wrap{ max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:16px; align-items:center; text-align:center;}
  .about p{ font-size:14px; line-height:2; color:var(--brown-soft); }
  .badge-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px;}
  .season-note{ font-size:11.5px; color:var(--spice); margin-top:8px !important; }
  .menu-note{ text-align:center; font-size:11.5px; color:var(--brown-soft); margin-top:16px; }
  .menu-cat{ max-width:460px; margin:0 auto 34px; }
  .menu-cat:last-of-type{ margin-bottom:0; }
  .menu-cat-title{ font-size:15px; margin:0 0 12px; color:var(--brown); border-bottom:2px dashed var(--ivory-deep); padding-bottom:8px; }
  .menu-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    background:var(--white); border-radius:12px; padding:11px 14px; margin-bottom:8px;
    font-size:12.5px; box-shadow:0 3px 0 var(--ivory-deep);
  }
  .menu-row small{ color:var(--brown-soft); font-size:10.5px; }
  .menu-row b{ color:var(--spice); white-space:nowrap; font-size:13px; }
  .badge{ background:var(--green-soft); color:var(--brown); font-size:12px; padding:6px 14px; border-radius:20px; border:1px dashed var(--green); }

  .menu-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; max-width:480px; margin:0 auto; }
  .menu-card{
    background:var(--white); border-radius:20px; padding:16px 12px; text-align:center;
    box-shadow:0 4px 0 var(--ivory-deep); transition:transform .2s ease;
  }
  .menu-card:hover, .menu-card:active{ transform:translateY(-4px); }
  .menu-card .icon{ font-size:28px; display:block; margin-bottom:6px; }
  .menu-card h3{ font-size:13.5px; margin:0 0 4px; }
  .menu-card p{ font-size:11px; color:var(--brown-soft); margin:0; line-height:1.6; }
  .menu-card.full{ grid-column:1/3; display:flex; align-items:center; gap:14px; text-align:left; }

  .workshop, .kyoshitsu{ background:var(--green-soft); border-radius:36px; margin:0 14px; }
  .flow-row{ display:flex; flex-direction:column; gap:12px; max-width:460px; margin:0 auto; }
  .flow-item{
    background:var(--white); border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:center;
    border-left:4px solid var(--green);
  }
  .flow-num{ font-family:'Yomogi',cursive; font-size:20px; color:var(--green); }
  .flow-item h4{ margin:0 0 3px; font-size:13.5px; }
  .flow-item p{ margin:0; font-size:11.5px; color:var(--brown-soft); }

  .events{ background:var(--white); }
  .event-list{ max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .event-item{
    background:var(--ivory); border-radius:16px; padding:14px 16px;
    display:flex; gap:12px; align-items:flex-start; border-left:4px solid var(--spice);
  }
  .event-date{ font-size:11px; color:var(--spice); font-weight:700; white-space:nowrap; }
  .event-item h4{ margin:2px 0 4px; font-size:13px; }
  .event-item p{ margin:0; font-size:11px; color:var(--brown-soft); }

  .access-box{
    max-width:420px; margin:0 auto; background:var(--white); border-radius:20px; padding:20px;
    text-align:center; box-shadow:0 4px 0 var(--ivory-deep);
  }
  .access-box p{ font-size:13px; color:var(--brown-soft); line-height:1.9; margin:0 0 14px; }

  .contact-box{
    max-width:420px; margin:0 auto; display:flex; flex-direction:column; gap:12px;
  }
  .contact-item{
    background:var(--white); border-radius:16px; padding:16px; display:flex; gap:14px; align-items:center;
    box-shadow:0 4px 0 var(--ivory-deep);
  }
  .contact-item .ic{ font-size:22px; }
  .contact-item h4{ margin:0 0 2px; font-size:13px; }
  .contact-item p{ margin:0; font-size:11.5px; color:var(--brown-soft); }

  .cat-strip{ text-align:center; padding:30px 22px 6px; }
  .cat-strip .hand{ font-size:15px; color:var(--brown-soft); }

  footer{ background:var(--brown); color:var(--ivory); padding:36px 22px 26px; text-align:center; margin-top:16px; }
  .sns-row{ display:flex; justify-content:center; gap:16px; margin:18px 0; }
  .sns-row a{
    width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.1);
    display:flex; align-items:center; justify-content:center; color:var(--ivory); text-decoration:none; font-size:12px;
  }
  footer .addr{ font-size:11px; color:#D9C9B6; line-height:1.8; }

  .header-left{ display:flex; align-items:center; gap:8px; }
  .header-tagline{ font-size:13px; color:var(--brown-soft); white-space:nowrap; }
  @media(max-width:380px){ .header-tagline{ display:none; } }

  .reserve-note{ font-size:11.5px; color:var(--brown-soft); line-height:1.8; max-width:300px; margin:12px auto 0; }

  .page-title{ text-align:center; padding:34px 22px 6px; }
  .page-title h1{ font-family:'Yomogi',cursive; font-size:28px; margin:0 0 6px; }
  .page-title p{ font-size:12px; color:var(--brown-soft); letter-spacing:.1em; }
  .back-link{ display:block; text-align:center; font-size:12px; color:var(--brown-soft); margin-top:10px; }

  .contact-wrap{ max-width:440px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  .contact-card{
    background:var(--white); border-radius:20px; padding:22px;
    box-shadow:0 4px 0 var(--ivory-deep); text-align:center;
  }
  .contact-card .ic{ font-size:34px; display:block; margin-bottom:10px; }
  .contact-card h3{ margin:0 0 8px; font-size:15px; }
  .contact-card a.val{
    display:inline-block; font-size:18px; color:var(--spice); text-decoration:none;
    font-family:'Yomogi',cursive; margin-bottom:6px;
  }
  .contact-card p{ margin:0; font-size:11.5px; color:var(--brown-soft); line-height:1.7; }
</style>
</head>

<script>
  const burger = document.getElementById('burgerBtn');
  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('scrim');
  function closeDrawer(){ burger.classList.remove('open'); drawer.classList.remove('open'); scrim.classList.remove('open'); }
  burger.addEventListener('click', () => {
    burger.classList.toggle('open');
    drawer.classList.toggle('open');
    scrim.classList.toggle('open');
  });
  scrim.addEventListener('click', closeDrawer);
  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', closeDrawer));

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('show'); } });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
